# 環状線の地図（docs/map/ring.html）を作って、GitHub Pages に載せる。
# main に push するたびに、本物の autodealer.game() を流して作り直す（ring.html はコミットしない）。
name: Pages（環状線の地図）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 地図を作る
        run: python docs/map/build.py
      - name: 載せるファイルをそろえる
        run: |
          mkdir -p _site
          cp docs/map/ring.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
